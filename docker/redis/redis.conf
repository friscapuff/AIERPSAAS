# Redis Configuration for AiERP
# Production-ready configuration with memory management and persistence

# Network and Protocol
port 6379
bind 0.0.0.0
timeout 0
tcp-backlog 511
tcp-keepalive 300

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Eviction Policy: Least Recently Used across all keys
# Alternative policies:
# - volatile-lru: LRU eviction only among keys with expiration
# - volatile-lfu: Least Frequently Used among keys with expiration
# - volatile-ttl: Evict keys with shortest TTL
# - noeviction: Return error when max memory is reached
# - allkeys-random: Random eviction from all keys
# - volatile-random: Random eviction from keys with expiration

# Persistence Configuration
# RDB Snapshots
save 900 1        # Save after 900 seconds (15 min) if 1 key changed
save 300 10       # Save after 300 seconds (5 min) if 10 keys changed
save 60 10000     # Save after 60 seconds if 10000 keys changed

# Disable RDB snapshots in favour of AOF (optional)
# save ""

# Persistence filename
dbfilename dump.rdb

# Working directory where the DB file will be written
dir /data

# AOF Persistence (Append-Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Rewrite AOF file to reduce size
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging
loglevel notice
logfile ""

# Databases
databases 16

# Security
# Require authentication (set a strong password in production)
# requirepass your_strong_password_here

# Clients
maxclients 10000

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Key Eviction
# Hash slot migration disabled for non-cluster mode
# cluster-enabled no

# Replication (if needed)
# replicaof <masterip> <masterport>
# replicaof-read-only yes

# Module Loading (if needed)
# loadmodule /path/to/module.so

# Include other config files
# include /path/to/other.conf

# Stop writing to AOF if there's a disk error
stop-writes-on-bgsave-error yes

# Compress RDB file
rdbcompression yes

# Checksum RDB file
rdbchecksum yes

# Lazy Freeing
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Active Defragmentation
activedefrag no
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10

# Protect mode (disabled for local dev — no password set)
protected-mode no
