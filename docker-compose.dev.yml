version: '3.9'

# Development Override Configuration
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# This file overrides production settings for local development

services:
  postgres:
    # Keep PostgreSQL persistent across restarts
    restart: always
    environment:
      # More verbose logging for development
      POSTGRES_INITDB_ARGS: "-c search_path=aierp,public -c log_statement=all"
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"

  redis:
    restart: always
    # Override to disable persistence in development
    command: redis-server /usr/local/etc/redis/redis.conf --appendonly no

  api:
    # Build from source with context for development
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: builder
    restart: always
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aierp_dev
      DB_USER: postgres
      DB_PASSWORD: postgres

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      # API Configuration
      API_PORT: 3000
      API_HOST: 0.0.0.0

      # JWT and Security
      JWT_SECRET: dev-secret-key
      JWT_EXPIRATION: 30d

      # CORS - Allow localhost frontend
      CORS_ORIGIN: "http://localhost:3001,http://localhost:3000"

      # Development flags
      DEBUG: "aierp:*"

    ports:
      - "3000:3000"
      # NestJS debug port
      - "9229:9229"

    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./dist:/app/dist
      - ./node_modules:/app/node_modules
      # Exclude node_modules from bind mount
      - /app/node_modules

    # Override entrypoint for development with file watching
    command: npm run start:dev

    # Expose debug port
    expose:
      - "9229"

  pgadmin:
    # Auto-start pgadmin in development
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@aierp.local
      PGADMIN_DEFAULT_PASSWORD: devpassword
      # Skip version check
      SCRIPT_NAME: /pgadmin
    ports:
      - "5050:80"
